server.port=${PORT:8080}

# Primary datasource: In-memory H2 with MySQL mode (zero setup required to run immediately)
spring.datasource.url=jdbc:h2:mem:escrowflow;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Uncomment below to connect directly to an external MySQL server:
# spring.datasource.url=jdbc:mysql://localhost:3306/escrowflow?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
# spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
# spring.datasource.username=root
# spring.datasource.password=root

spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

# H2 Console for debugging
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# JWT Configuration (HMAC SHA-256 256-bit secret)
jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
jwt.expiration=86400000

# JSON Jackson configuration
spring.jackson.deserialization.fail-on-unknown-properties=false
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=Asia/Kolkata
